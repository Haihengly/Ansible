---
# tasks file for database

- name: Ensure Docker network exists
  community.docker.docker_network:
    name: "{{ docker_network }}"
    state: present

- name: Create DB docker folder
  file:
    path: "/home/{{ ansible_user }}/db_docker"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755' 

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "/home/{{ ansible_user }}/db_docker/docker-compose.yml"

- name: Run database container (docker-compose v2)
  community.docker.docker_compose_v2:
    project_src: "/home/{{ ansible_user }}/db_docker"
    state: present
    recreate: auto        
    remove_orphans: yes
    pull: always           
    build: always          
    wait: yes 